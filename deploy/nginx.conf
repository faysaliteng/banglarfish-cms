# Banglarfish nginx site config.
# Install to: /etc/nginx/sites-available/banglarfish  (symlink into sites-enabled)
# Then run certbot to add TLS:  sudo certbot --nginx -d banglarfish.com -d www.banglarfish.com

server {
    listen 80;
    listen [::]:80;
    server_name banglarfish.com www.banglarfish.com;

    # Uploaded media, served straight from disk (matches UPLOAD_DIR in .env).
    location /uploads/ {
        alias /var/www/banglarfish/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Hashed build assets — long cache.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> Node server.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 12m;   # allow media uploads (<= 8MB payload + overhead)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
